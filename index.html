<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ETF Agent | 指数 ETF 工作台</title>
    <script>
      (function () {
        const stored = localStorage.getItem("stockagent.theme");
        const theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        if (localStorage.getItem("stockagent.sidebar") === "collapsed" && window.innerWidth > 1180) {
          document.documentElement.dataset.sidebar = "collapsed";
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <div class="app-shell">
      <aside id="appSidebar" class="sidebar" aria-label="工作区导航">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">EA</div>
          <div class="brand-text">
            <p>ETF Agent</p>
            <span>投资组合工作台</span>
          </div>
          <button id="mobileSidebarClose" class="mobile-sidebar-close ghost-button" type="button" aria-label="关闭导航">
            <span aria-hidden="true">×</span>
          </button>
        </div>

        <div class="sidebar-pool">
          <div class="sidebar-pool-heading">
            <p>资产类别</p>
            <span class="muted" id="sidebarPoolCount">0</span>
          </div>
          <nav id="sidebarEtfList" class="sidebar-etf-list" aria-label="资产类别"></nav>
        </div>

        <div class="sidebar-footer">
          <nav class="nav-stack nav-stack-footer" aria-label="工作区工具">
            <button class="nav-item active" data-view="home" type="button" title="组合总览">
              <span class="icon" aria-hidden="true">◎</span>
              <span class="nav-label">组合总览</span>
            </button>
            <button class="nav-item" data-view="assets" type="button" title="资产与持仓">
              <span class="icon" aria-hidden="true">▣</span>
              <span class="nav-label">资产与持仓</span>
            </button>
            <button class="nav-item" data-view="transactions" type="button" title="交易记录"><span class="icon" aria-hidden="true">≡</span><span class="nav-label">交易记录</span></button>
            <button class="nav-item" data-view="plans" type="button" title="投资计划"><span class="icon" aria-hidden="true">◷</span><span class="nav-label">投资计划</span></button>
            <button class="nav-item" data-view="settings" type="button" title="设置">
              <span class="icon" aria-hidden="true">⚙</span>
              <span class="nav-label">设置</span>
            </button>
          </nav>
          <button
            id="sidebarToggle"
            class="sidebar-toggle ghost-button compact"
            type="button"
            aria-label="收起侧边栏"
            aria-expanded="true"
          >
            <span class="sidebar-toggle-icon" aria-hidden="true">‹</span>
          </button>
        </div>
      </aside>

      <button
        id="sidebarBackdrop"
        class="sidebar-backdrop"
        type="button"
        aria-label="关闭导航"
        aria-hidden="true"
        tabindex="-1"
      ></button>

      <main id="main-content" class="workspace" tabindex="-1">
        <header class="topbar">
          <div class="topbar-main">
            <button
              id="mobileSidebarToggle"
              class="mobile-sidebar-toggle ghost-button"
              type="button"
              aria-label="打开导航"
              aria-controls="appSidebar"
              aria-expanded="false"
            >
              <span aria-hidden="true">☰</span>
            </button>
            <div class="topbar-title-block">
              <h1 id="pageTitle">ETF Agent</h1>
              <p id="pageSubtitle" class="page-subtitle" hidden>
                <span id="pageSubtitleText"></span>
              </p>
              <div class="session-strip" aria-label="数据状态摘要">
                <span><i class="status-dot"></i><strong id="topSourceStatus">行情连接中</strong></span>
              </div>
            </div>
          </div>
          <div class="topbar-actions">
            <button
              id="etfRefresh"
              class="icon-button ghost-button compact"
              type="button"
              aria-label="刷新行情"
              title="刷新行情"
            >
              <span class="action-icon" aria-hidden="true">↻</span>
            </button>
            <button id="themeToggle" class="theme-toggle ghost-button compact" type="button" aria-label="切换到暗黑模式" title="切换外观">
              <svg class="theme-icon theme-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5Z" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <svg class="theme-icon theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="3.5" stroke="currentColor" stroke-width="1.75"/>
                <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        </header>

        <section id="homeView" class="view active">
          <div data-portfolio-root></div>
        </section>

        <section id="assetsView" class="view"><div data-portfolio-root></div></section>
        <section id="transactionsView" class="view"><div data-portfolio-root></div></section>
        <section id="plansView" class="view"><div data-portfolio-root></div></section>

        <section id="dividendView" class="view">
          <div id="dividendStatus" class="research-load-status muted" role="status" hidden></div>
          <div id="dividendContent" class="dividend-content" hidden></div>
        </section>

        <section id="settingsView" class="view">
          <div class="settings-layout">
            <section class="settings-card">
              <div class="panel-heading settings-heading">
                <h2 class="section-title">应用设置</h2>
                <div class="settings-actions">
                  <button id="saveConfig" class="primary-button compact" type="button">保存</button>
                </div>
              </div>
              <div id="settingsForm" class="settings-form"></div>
              <p id="settingsStatus" class="settings-status muted" role="status"></p>
            </section>
            <section class="settings-card">
              <div class="panel-heading settings-heading">
                <h2 class="section-title">工作区备份</h2>
                <div class="settings-actions">
                  <button id="syncWorkspaceNow" class="ghost-button compact" type="button">同步</button>
                  <button id="exportWorkspace" class="ghost-button compact" type="button">导出</button>
                  <button id="importWorkspace" class="primary-button compact" type="button">导入</button>
                  <input id="importWorkspaceFile" type="file" accept="application/json,.json" hidden />
                </div>
              </div>
              <p id="workspaceStatus" class="settings-status muted" role="status" hidden></p>
              <div id="portfolioRecovery"></div>
              <div id="portfolioImportReview"></div>
            </section>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./js/main.js?v=20260916a"></script>
  </body>
</html>
